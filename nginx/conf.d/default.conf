# =====================================================================================
# Nginx 站点配置（挂载到 /etc/nginx/conf.d）
# 角色：通用 Web 入口 —— 静态站点 + 可选反向代理示例
# 重载配置：docker exec nginx nginx -s reload
# =====================================================================================

server {
    listen       80;
    server_name  _;

    # ---- 静态站点根目录（宿主机 D:\local\basic-service-data\nginx\html）----
    root  /usr/share/nginx/html;
    index index.html;

    # ---- 访问日志/错误日志（已落盘到数据目录 nginx\logs）----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 仓库源文件只读发布（BasicStack 发布页 publish.html 通过同源 fetch /repo/... 读取清单与源文件，
    #      再经 GitHub API 上传建仓；仅本机/局域网使用，请勿暴露公网） ----
    location /repo/ {
        alias /srv/basic-service/;
        add_header Cache-Control "no-cache";
    }

    # ========== 反向代理示例（按需取消注释并改端口，改完执行 nginx -s reload） ==========
    # 代理 GitLab：    location /gitlab/      { proxy_pass http://gitlab:8181/; }
    # 代理 Jenkins：   location /jenkins/     { proxy_pass http://jenkins:8080/; }
    # 代理 Nacos：     location /nacos/       { proxy_pass http://nacos:8848/nacos/; }
    # 代理 RabbitMQ：  location /rabbitmq/    { proxy_pass http://rabbitmq:15672/; }
    # 代理 MinerU：    location /mineru/      { proxy_pass http://mineru:8000/; }

    # ==== 通用代理头（启用上面任意代理时建议一并打开）====
    # proxy_set_header Host              $host;
    # proxy_set_header X-Real-IP         $remote_addr;
    # proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 健康检查端点 ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
