# 基石服务栈 BasicStack · Release 工作流
# 触发：推送 v* 标签（git tag v1.0.1 && git push origin v1.0.1，或发布页推送标签）。
# 产物：整仓 zip 包 + GitHub Release（发布说明取 CHANGELOG.md 最新版本段落）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pack repository zip
        run: zip -r "basic-service-${GITHUB_REF_NAME}.zip" . -x ".git/*" "agent-evolution-ppt/*" "projects/*" "diagram-plugin-mcp-skill/*"

      - name: Extract changelog as release notes
        run: awk '/^## \[/{c++; if(c==2) exit} c==1' CHANGELOG.md > release_body.md

      - name: Create release with zip package
        uses: softprops/action-gh-release@v2
        with:
          files: basic-service-*.zip
          body_path: release_body.md
