<?xml version="1.0" encoding="UTF-8"?>
<!--
  基石服务栈 BasicStack · 主标志（徽章版）
  设计语义：三层递进的砌块 = 服务栈（Stack）；顶部的梯形楔块 = 基石（Cornerstone）；
  整体轮廓向上收拢 = docker compose up 拉起的意象。
  本文件为原创矢量图形，可任意缩放。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="BasicStack logo">
  <defs>
    <radialGradient id="bsGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1E6FE8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1E6FE8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1E6FE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 徽章底板 -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="#0B1626"/>
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#bsGlow)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#22334F" stroke-width="1.5"/>

  <!-- 基石（顶部楔形块） -->
  <path d="M35 27 H61 L57 39 H39 Z" fill="#F5A93C" stroke="#F5A93C" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 中层砌块 -->
  <rect x="31" y="43" width="34" height="12" rx="3" fill="#1E6FE8"/>
  <!-- 底层砌块（最宽，寓意地基） -->
  <rect x="25" y="59" width="46" height="12" rx="3" fill="#7EB3F7"/>
</svg>
